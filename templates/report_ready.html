{% extends "base.html" %}

{% block title %}Report Ready{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-12 px-4">
    <div id="card" class="bg-white rounded-lg shadow-md border-l-4 border-yellow-500 p-8 text-center">
        <h2 id="heading" class="text-4xl font-bold text-yellow-600 mb-4">Report generated</h2>
        <p id="message" class="text-lg text-gray-700 mb-2">
            Sending the report to <strong>{{ email }}</strong>&hellip;
        </p>
        <p id="note" class="text-sm text-gray-500 mb-8">Keep this page open until it confirms the email was sent.</p>
        <button id="retry" class="hidden mb-4 px-8 py-3 bg-red-600 text-white rounded-md font-semibold hover:bg-red-700 transition duration-200">
            Retry sending
        </button>
        <br>
        <a href="/" class="inline-block px-8 py-3 bg-blue-600 text-white rounded-md font-semibold hover:bg-blue-700 transition duration-200">
            Back to Dashboard
        </a>
    </div>
</div>

<script>
(function () {
    const jobId = "{{ job_id }}";
    const email = {{ email|tojson }};
    const card = document.getElementById('card');
    const heading = document.getElementById('heading');
    const message = document.getElementById('message');
    const note = document.getElementById('note');
    const retry = document.getElementById('retry');
    let polls = 0, timer = null;

    function setState(color, head, msg, noteText) {
        card.className = card.className.replace(/border-(yellow|green|red)-500/, 'border-' + color + '-500');
        heading.className = heading.className.replace(/text-(yellow|green|red)-600/, 'text-' + color + '-600');
        heading.textContent = head;
        message.textContent = msg;
        note.textContent = noteText;
    }

    async function poll() {
        polls++;
        try {
            const r = await fetch('/email-status/' + jobId, {cache: 'no-store'});
            const d = await r.json();
            if (d.status === 'sent') {
                setState('green', 'Success!', 'The inspection report has been sent to ' + email + '.',
                         'The email may take a few minutes to arrive.');
                retry.classList.add('hidden');
                return;
            }
            if (d.status === 'failed') {
                setState('red', 'Email failed',
                         'The report was generated but the email could not be sent to ' + email + '.',
                         'The admin has been notified. You can try sending it again.');
                retry.classList.remove('hidden');
                return;
            }
        } catch (e) { /* transient network error: keep polling */ }
        if (polls < 100) { timer = setTimeout(poll, 3000); }
        else {
            setState('yellow', 'Still sending...', 'This is taking longer than expected.',
                     'Check your inbox shortly, or press Retry if it does not arrive.');
            retry.classList.remove('hidden');
        }
    }

    retry.addEventListener('click', async function () {
        retry.disabled = true;
        try {
            const r = await fetch('/email-resend/' + jobId, {method: 'POST'});
            const d = await r.json();
            if (!d.ok) { note.textContent = d.message; retry.disabled = false; return; }
        } catch (e) { note.textContent = 'Could not reach the server.'; retry.disabled = false; return; }
        retry.classList.add('hidden'); retry.disabled = false;
        setState('yellow', 'Report generated', 'Sending the report to ' + email + '...',
                 'Keep this page open until it confirms the email was sent.');
        polls = 0; poll();
    });

    poll();
})();
</script>
{% endblock %}
